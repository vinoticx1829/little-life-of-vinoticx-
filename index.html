const opts=(l,v)=>l.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
async function admin(){const a=$('app');
 if(!tok){a.innerHTML=`<h2>Admin login</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="login()">Log in</button><div id="msg"></div>`;return}
 const T=['posts','products','categories','stats','settings'];
 let h=`<h2>Admin</h2><div class="chips">${T.map(t=>`<button class="${tab==t?'on':''}" onclick="tab='${t}';edit=null;admin()">${t}</button>`).join('')}</div>`;
 if(tab=='posts'){const e=D.posts.find(x=>x.id==edit)||{};
  h+=`<div class="card"><h3>${edit?'Edit':'New'} post</h3><input id="t" placeholder="Title" value="${esc(e.title)}"><select id="s" onchange="refc()">${S.filter(s=>s[0]!='finds').map(s=>`<option value="${s[0]}" ${s[0]==e.sec?'selected':''}>${s[1]}</option>`).join('')}</select><select id="c"></select><textarea id="x" rows="3" placeholder="Ingredients / materials, one per line">${esc(e.extra)}</textarea><textarea id="b" rows="8" placeholder="Write your story, recipe steps or tutorial…">${esc(e.body)}</textarea><input type="file" id="f" accept="image/*"><label><input type="checkbox" id="ft" style="width:auto" ${e.feat?'checked':''}> Feature on Home</label> <label><input type="checkbox" id="sp" style="width:auto" ${e.spons?'checked':''}> Sponsored</label><br><button class="btn" onclick="savP()">Publish</button></div>`+D.posts.map(p=>`<div class="row"><span>${esc(p.title)}${p.feat?' ★':''}</span><span><button class="btn sm" onclick="sharePost(${p.id},1)">Copy link</button> <button class="btn sm" onclick="edit=${p.id};admin()">Edit</button> <button class="btn alt sm" onclick="del('posts',${p.id})">Delete</button></span></div>`).join('')}
 else if(tab=='products'){const e=D.prods.find(x=>x.id==edit)||{};
  h+=`<div class="card"><h3>${edit?'Edit':'Add'} product</h3><div class="note">Paste only your own real affiliate link (https://…). Price is optional.</div><input id="n" placeholder="Product name" value="${esc(e.name)}"><input id="u" placeholder="Your affiliate link" value="${esc(e.url)}"><input id="st" placeholder="Store (Amazon India, Meesho, Myntra…)" value="${esc(e.store)}"><input id="pr" placeholder="Price (optional)" value="${esc(e.price)}"><select id="s" onchange="refc()">${S.map(s=>`<option value="${s[0]}" ${s[0]==(e.sec||'finds')?'selected':''}>${s[1]}</option>`).join('')}</select><select id="c"></select><textarea id="nt" rows="3" placeholder="Why you recommend it">${esc(e.note)}</textarea><input type="file" id="f" accept="image/*"><label><input type="checkbox" id="ft" style="width:auto" ${e.feat?'checked':''}> Feature on Home</label><br><button class="btn" onclick="savR()">Save product</button></div>`+D.prods.map(p=>`<div class="row"><span>${esc(p.name)}${p.feat?' ★':''}</span><span><button class="btn sm" onclick="edit=${p.id};admin()">Edit</button> <button class="btn alt sm" onclick="del('products',${p.id})">Delete</button></span></div>`).join('')}
 else if(tab=='categories'){h+=S.map(s=>`<div class="card"><b>${s[1]}</b><input id="k-${s[0]}" value="${esc((D.cats[s[0]]||[]).join(', '))}"></div>`).join('')+`<button class="btn" onclick="savC()">Save categories</button><p>Separate with commas.</p>`}
 else if(tab=='stats'){h+='<div id="st2">Loading…</div>'}
 else{h+=`<div class="card"><h3>About me text</h3><textarea id="ab" rows="8">${esc(D.about)}</textarea><button class="btn" onclick="saveSet('about',$('ab').value)">Save</button></div><button class="btn alt" onclick="logout()">Log out</button>`}
 a.innerHTML=h;refc();if(tab=='stats')stats()}
async function stats(){try{const[v,c]=await Promise.all([api('/rest/v1/views?select=id&limit=100000'),api('/rest/v1/clicks?select=product_id&limit=100000')]);const m={};c.forEach(x=>m[x.product_id]=(m[x.product_id]||0)+1);
 $('st2').innerHTML=`<div class="note">Real counts from your database. Page views are recorded when someone opens a page; they include your own visits.</div><p>Page views: <b>${v.length}</b> · Affiliate clicks: <b>${c.length}</b></p>${D.prods.map(p=>`<div class="row"><span>${esc(p.name)}</span><b>${m[p.id]||0}</b></div>`).join('')||'<p>No products yet.</p>'}`}catch(e){$('st2').textContent='Could not load stats.'}}
function refc(){const s=$('s'),c=$('c');if(!s||!c)return;const cur=(D.posts.find(x=>x.id==edit)||D.prods.find(x=>x.id==edit)||{}).cat;c.innerHTML=opts(D.cats[s.value]||[],cur)}
async function login(){try{const r=await api('/auth/v1/token?grant_type=password',{m:'POST',b:{email:$('em').value.trim(),password:$('pw').value}});tok=r;localStorage.setItem('vls',JSON.stringify(r));await admin()}catch(e){$('msg').innerHTML='<div class="note">Problem: '+esc(e.message)+'</div>'}}
function logout(){tok=null;localStorage.removeItem('vls');admin()}
function pick(){return new Promise(res=>{const f=$('f').files[0];if(!f)return res(null);const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1000/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.8)};i.src=e.target.result};r.readAsDataURL(f)})}
async function up(){const b=await pick();if(!b)return null;const n=Date.now()+'.jpg';await api('/storage/v1/object/photos/'+n,{m:'POST',b,raw:true,h:{'Content-Type':'image/jpeg'}});return U+'/storage/v1/object/public/photos/'+n}
async function write(tbl,body){const q=edit?`?id=eq.${edit}`:'';await api('/rest/v1/'+tbl+q,{m:edit?'PATCH':'POST',b:body,h:{Prefer:'return=minimal'}});edit=null;await load();admin()}
async function savP(){if(!$('t').value.trim())return alert('Add a title');try{const im=await up(),b={title:$('t').value,sec:$('s').value,cat:$('c').value,extra:$('x').value,body:$('b').value,feat:$('ft').checked,spons:$('sp').checked};if(im)b.img=im;await write('posts',b)}catch(e){alert('Could not save: '+e.message)}}
async function savR(){const u=$('u').value.trim();if(!$('n').value.trim())return alert('Add a name');if(u&&!/^https:\/\//.test(u))return alert('Link must start with https://');try{const im=await up(),b={name:$('n').value,url:u,store:$('st').value,price:$('pr').value,sec:$('s').value,cat:$('c').value,note:$('nt').value,feat:$('ft').checked};if(im)b.img=im;await write('products',b)}catch(e){alert('Could not save: '+e.message)}}
async function del(t,id){if(!confirm('Delete this?'))return;try{await api(`/rest/v1/${t}?id=eq.${id}`,{m:'DELETE'});await load();admin()}catch(e){alert(e.message)}}
async function saveSet(k,v){try{await api('/rest/v1/settings?on_conflict=key',{m:'POST',b:{key:k,value:v},h:{Prefer:'resolution=merge-duplicates,return=minimal'}});await load();alert('Saved')}catch(e){alert('Could not save: '+e.message)}}
function savC(){const c={};S.forEach(s=>{c[s[0]]=$('k-'+s[0]).value.split(',').map(x=>x.trim()).filter(Boolean)});saveSet('cats',JSON.stringify(c))}
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='on';setTimeout(()=>{e.className=''},2200)}
async function sharePost(id,copyOnly){const p=D.posts.find(x=>x.id==id);if(!p)return;const url=location.origin+location.pathname+'#post-'+id;
 if(!copyOnly&&navigator.share){try{await navigator.share({title:p.title,url});return}catch(e){if(e.name=='AbortError')return}}
 try{await navigator.clipboard.writeText(url);toast('Link copied ✿')}catch(e){prompt('Copy this link:',url)}}
addEventListener('hashchange',()=>{filt='';route();if((location.hash||'#home')=='#home'&&loaded)api('/rest/v1/views',{m:'POST',b:{path:'home'},h:{Prefer:'return=minimal'}}).catch(()=>{})});
load().then(()=>{route();if(!location.hash||location.hash=='#home')api('/rest/v1/views',{m:'POST',b:{path:'home'},h:{Prefer:'return=minimal'}}).catch(()=>{})});route();
</script></body></html>
