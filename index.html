<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Little Life of Vinoticx</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe0;--card:#fffaf0;--ink:#3b2a1e;--green:#2f4a35;--olive:#7a7f45;--terra:#b5532f;--line:#d9c9a8;--btn:#2f4a35;--btnt:#f6efe0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1f1a14;--card:#2a231b;--ink:#efe3cc;--green:#9fbf9a;--olive:#b3b872;--terra:#e08a63;--line:#4a3f30;--btn:#9fbf9a;--btnt:#1f1a14;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 'Cormorant Garamond',Georgia,serif}
.hand{font-family:'Caveat','Comic Sans MS',cursive}
header{background:var(--green);color:#f6efe0;padding:14px 16px;text-align:center;border-bottom:4px double var(--terra)}
header h1{margin:0;font-size:1.7rem}header small{font-family:'Caveat',cursive;font-size:1.2rem;color:#e9c9a0}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;color:var(--ink);text-decoration:none;padding:5px 12px;border:1px solid var(--line);border-radius:20px;font-size:.95rem}
nav a.on{background:var(--terra);color:#fff;border-color:var(--terra)}
main{max-width:900px;margin:0 auto;padding:18px 14px 60px}
h2{color:var(--green);font-size:1.9rem;margin:.2em 0}h3{color:var(--terra);margin:.3em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;box-shadow:2px 3px 0 var(--line)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border:6px solid #fff;outline:1px solid var(--line);margin-bottom:8px}
.tag{display:inline-block;font-size:.8rem;color:var(--olive);border:1px dashed var(--olive);padding:0 8px;border-radius:10px;margin-right:4px}
.btn{display:inline-block;background:var(--btn);color:var(--btnt);border:0;padding:8px 16px;border-radius:4px;font:inherit;cursor:pointer}
.btn.alt{background:var(--terra);color:#fff}.btn.sm{padding:3px 10px;font-size:.9rem}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;margin:3px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{font:inherit;padding:3px 12px;border:1px solid var(--olive);background:none;color:var(--ink);border-radius:16px;cursor:pointer}.chips button.on{background:var(--olive);color:#fff}
.hero{text-align:center;padding:26px 10px;border:2px dashed var(--olive);border-radius:8px;background:var(--card)}
.ad{border:1px dashed var(--line);text-align:center;padding:14px;margin:18px 0;font-size:.85rem;opacity:.8}
.note{background:var(--card);border-left:4px solid var(--terra);padding:8px 12px;margin:10px 0;font-size:.95rem}
.empty{text-align:center;padding:30px;opacity:.8}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0;flex-wrap:wrap}
pre{white-space:pre-wrap;font:inherit}footer{text-align:center;padding:20px;font-size:.85rem;opacity:.8}
</style></head><body>
<header><h1>The Little Life of Vinoticx</h1><small>slow days, warm tea &amp; little joys · @by.vinoticx</small></header>
<nav id="nav"></nav><main id="app"><div class="empty hand">Loading…</div></main>
<footer>© The Little Life of Vinoticx <a href="#admin" style="color:inherit">·</a></footer>
<script>
const U='https://ouppqoojivsurhqpebld.supabase.co',K='sb_publishable_mRSZpfKI9oao6x_3f_ss9g_r_1oFJc1';
const S=[['days','Ordinary Days'],['kitchen','From My Kitchen'],['garden','My Little Garden'],['love','Made With Love'],['finds','Little Finds'],['gallery','My Gallery'],['study','Study & Grow']];
const DC={days:['Diaries','Reels','Outings'],kitchen:['Kanyakumari','South Indian','International','Baking'],garden:['Plants','Flowers','Vegetables','Harvest'],love:['Crochet','Granny squares','DIY'],finds:['Fashion','Kitchenware','Home decor','Plants & garden'],gallery:['Cats','Nature','Food','Home corners'],study:['Studying','Learning','Growth']};
let D={posts:[],prods:[],cats:DC,about:''},tok=null,tab='posts',filt='',q='',edit=null,loaded=false,err='';
try{tok=JSON.parse(localStorage.getItem('vls'))}catch(e){}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),sn=id=>(S.find(s=>s[0]==id)||[0,id])[1];
const dt=p=>new Date(p.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
async function api(p,o={}){const h={apikey:K,'Content-Type':'application/json',...(o.h||{})};if(tok)h.Authorization='Bearer '+tok.access_token;
 const r=await fetch(U+p,{method:o.m||'GET',headers:h,body:o.b===undefined?undefined:(o.raw?o.b:JSON.stringify(o.b))});
 if(r.status==401&&tok){tok=null;localStorage.removeItem('vls');route();throw new Error('Please log in again')}
 if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function load(){try{const[a,b,c]=await Promise.all([api('/rest/v1/posts?select=*&order=created_at.desc'),api('/rest/v1/products?select=*&order=created_at.desc'),api('/rest/v1/settings?select=*')]);
 D.posts=a;D.prods=b;const s={};c.forEach(x=>s[x.key]=x.value);D.about=s.about||'';try{D.cats=s.cats?JSON.parse(s.cats):DC}catch(e){D.cats=DC};loaded=true;err=''}catch(e){err='Could not load content. Did you run setup.sql in Supabase?'}}
function pcard(p){return `<div class="card">${p.img?`<img src="${esc(p.img)}" alt="">`:''}<span class="tag">${esc(sn(p.sec))}</span>${p.cat?`<span class="tag">${esc(p.cat)}</span>`:''}${p.spons?'<span class="tag">Sponsored</span>':''}<h3><a href="#post-${p.id}" style="color:inherit;text-decoration:none">${esc(p.title)}</a></h3><small class="hand">${dt(p)}</small></div>`}
function prcard(p){return `<div class="card">${p.img?`<img src="${esc(p.img)}" alt="">`:''}<span class="tag">${esc(p.store)}</span>${p.cat?`<span class="tag">${esc(p.cat)}</span>`:''}<h3>${esc(p.name)}</h3>${p.price?`<div>${esc(p.price)}</div>`:''}<div>${esc(p.note)}</div>${p.url?`<button class="btn alt sm" onclick="go(${p.id})">View on ${esc(p.store||'store')} ↗</button>`:'<small>(link not added yet)</small>'}</div>`}
function go(id){const p=D.prods.find(x=>x.id==id);window.open(p.url,'_blank','noopener');api('/rest/v1/clicks',{m:'POST',b:{product_id:id},h:{Prefer:'return=minimal'}}).catch(()=>{})}
const ad='<div class="ad">Ad space · Google AdSense code goes here once your account is approved</div>';
function chips(sec){return `<div class="chips"><button class="${filt?'':'on'}" onclick="filt='';route()">All</button>${(D.cats[sec]||[]).map(x=>`<button class="${filt==x?'on':''}" data-c="${esc(x)}" onclick="filt=this.dataset.c;route()">${esc(x)}</button>`).join('')}</div>`}
function route(){let h=(location.hash||'#home').slice(1);
 $('nav').innerHTML=[['home','Home'],...S,['about','About'],['search','🔍 Search']].map(s=>`<a href="#${s[0]}" class="${h==s[0]?'on':''}">${s[1]}</a>`).join('');
 const a=$('app');if(h=='admin')return admin();
 if(!loaded){a.innerHTML=err?`<div class="note">${err}</div>`:'<div class="empty hand">Loading…</div>';return}
 if(h=='home'){const fp=D.posts.filter(p=>p.feat),fr=D.prods.filter(p=>p.feat),lt=D.posts.slice(0,6);
  a.innerHTML=`<div class="hero"><h2>Welcome to my little corner ✿</h2><p class="hand" style="font-size:1.5rem">Here I keep my everyday life: kitchen, garden, yarn &amp; quiet days.</p></div>${fp.length?`<h2>Featured</h2><div class="grid">${fp.map(pcard).join('')}</div>`:''}${fr.length?`<h2>Featured finds</h2><div class="grid">${fr.map(prcard).join('')}</div>`:''}<h2>Latest updates</h2>${lt.length?`<div class="grid">${lt.map(pcard).join('')}</div>`:'<div class="empty hand">Nothing here yet.</div>'}${ad}`}
 else if(h.startsWith('post-')){const p=D.posts.find(x=>x.id==h.slice(5));if(!p){a.innerHTML='<div class="empty">Post not found.</div>';return}
  a.innerHTML=`<a href="#${p.sec}">← ${sn(p.sec)}</a><h2>${esc(p.title)}</h2><small class="hand">${dt(p)}</small>${p.spons?'<div class="note">Sponsored post: made in collaboration with a brand.</div>':''}${p.img?`<img src="${esc(p.img)}" style="width:100%;border:8px solid #fff;margin:10px 0" alt="">`:''}${p.extra?`<div class="card"><h3>Ingredients / materials</h3><pre>${esc(p.extra)}</pre></div>`:''}<pre>${esc(p.body)}</pre>${ad}`}
 else if(h=='search'){a.innerHTML=`<h2>Search</h2><input id="qi" placeholder="Search posts and finds…" value="${esc(q)}" oninput="q=this.value;sr()"><div id="sr"></div>`;sr()}
 else if(h=='about'){a.innerHTML=`<h2>About me</h2><div class="card"><pre>${esc(D.about)||'My story is coming soon.'}</pre></div><p><a href="https://www.instagram.com/by.vinoticx" target="_blank" rel="noopener">Instagram @by.vinoticx</a></p>`}
 else if(S.find(s=>s[0]==h)){const ps=D.posts.filter(p=>p.sec==h&&(!filt||p.cat==filt)),pr=D.prods.filter(p=>p.sec==h&&(!filt||p.cat==filt));
  a.innerHTML=`<h2>${sn(h)}</h2>${chips(h)}${h=='finds'?'<div class="note">Some links are affiliate links: I may earn a small commission at no extra cost to you.</div>':''}${ps.length?`<div class="grid">${ps.map(pcard).join('')}</div>`:''}${pr.length?`<h3>Recommended</h3><div class="grid">${pr.map(prcard).join('')}</div>`:''}${ps.length+pr.length?'':'<div class="empty hand">Nothing here yet.</div>'}${ad}`}
 else{location.hash='#home';return}
 scrollTo(0,0)}
function sr(){const t=q.toLowerCase(),r=t?[...D.posts.filter(p=>((p.title||'')+(p.body||'')+(p.cat||'')).toLowerCase().includes(t)).map(pcard),...D.prods.filter(p=>((p.name||'')+(p.note||'')+(p.store||'')).toLowerCase().includes(t)).map(prcard)]:[];$('sr').innerHTML=t?(r.length?`<div class="grid">${r.join('')}</div>`:'<div class="empty">No results.</div>'):''}
const opts=(l,v)=>l.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
async function admin(){const a=$('app');
 if(!tok){a.innerHTML=`<h2>Admin login</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="login()">Log in</button><div id="msg"></div>`;return}
 const T=['posts','products','categories','stats','settings'];
 let h=`<h2>Admin</h2><div class="chips">${T.map(t=>`<button class="${tab==t?'on':''}" onclick="tab='${t}';edit=null;admin()">${t}</button>`).join('')}</div>`;
 if(tab=='posts'){const e=D.posts.find(x=>x.id==edit)||{};
  h+=`<div class="card"><h3>${edit?'Edit':'New'} post</h3><input id="t" placeholder="Title" value="${esc(e.title)}"><select id="s" onchange="refc()">${S.filter(s=>s[0]!='finds').map(s=>`<option value="${s[0]}" ${s[0]==e.sec?'selected':''}>${s[1]}</option>`).join('')}</select><select id="c"></select><textarea id="x" rows="3" placeholder="Ingredients / materials, one per line">${esc(e.extra)}</textarea><textarea id="b" rows="8" placeholder="Write your story, recipe steps or tutorial…">${esc(e.body)}</textarea><input type="file" id="f" accept="image/*"><label><input type="checkbox" id="ft" style="width:auto" ${e.feat?'checked':''}> Feature on Home</label> <label><input type="checkbox" id="sp" style="width:auto" ${e.spons?'checked':''}> Sponsored</label><br><button class="btn" onclick="savP()">Publish</button></div>`+D.posts.map(p=>`<div class="row"><span>${esc(p.title)}${p.feat?' ★':''}</span><span><button class="btn sm" onclick="edit=${p.id};admin()">Edit</button> <button class="btn alt sm" onclick="del('posts',${p.id})">Delete</button></span></div>`).join('')}
 else if(tab=='products'){const e=D.prods.find(x=>x.id==edit)||{};
  h+=`<div class="card"><h3>${edit?'Edit':'Add'} product</h3><div class="note">Paste only your own real affiliate link (https://…). Price is optional.</div><input id="n" placeholder="Product name" value="${esc(e.name)}"><input id="u" placeholder="Your affiliate link" value="${esc(e.url)}"><input id="st" placeholder="Store (Amazon India, Meesho, Myntra…)" value="${esc(e.store)}"><input id="pr" placeholder="Price (optional)" value="${esc(e.price)}"><select id="s" onchange="refc()">${S.map(s=>`<option value="${s[0]}" ${s[0]==(e.sec||'finds')?'selected':''}>${s[1]}</option>`).join('')}</select><select id="c"></select><textarea id="nt" rows="3" placeholder="Why you recommend it">${esc(e.note)}</textarea><input type="file" id="f" accept="image/*"><label><input type="checkbox" id="ft" style="width:auto" ${e.feat?'checked':''}> Feature on Home</label><br><button class="btn" onclick="savR()">Save product</button></div>`+D.prods.map(p=>`<div class="row"><span>${esc(p.name)}${p.feat?' ★':''}</span><span><button class="btn sm" onclick="edit=${p.id};admin()">Edit</button> <button class="btn alt sm" onclick="del('products',${p.id})">Delete</button></span></div>`).join('')}
 else if(tab=='categories'){h+=S.map(s=>`<div class="card"><b>${s[1]}</b><input id="k-${s[0]}" value="${esc((D.cats[s[0]]||[]).join(', '))}"></div>`).join('')+`<button class="btn" onclick="savC()">Save categories</button><p>Separate with commas.</p>`}
 else if(tab=='stats'){h+='<div id="st2">Loading…</div>'}
 else{h+=`<div class="card"><h3>About me text</h3><textarea id="ab" rows="8">${esc(D.about)}</textarea><button class="btn" onclick="saveSet('about',$('ab').value)">Save</button></div><button class="btn alt" onclick="logout()">Log out</button>`}
 a.innerHTML=h;refc();if(tab=='stats')stats()}
async function stats(){try{const[v,c]=await Promise.all([api('/rest/v1/views?select=id&limit=100000'),api('/rest/v1/clicks?select=product_id&limit=100000')]);const m={};c.forEach(x=>m[x.product_id]=(m[x.product_id]||0)+1);
 $('st2').innerHTML=`<div class="note">Real counts from your database. Page views are recorded when someone opens a page; they include your own visits.</div><p>Page views: <b>${v.length}</b> · Affiliate clicks: <b>${c.length}</b></p>${D.prods.map(p=>`<div class="row"><span>${esc(p.name)}</span><b>${m[p.id]||0}</b></div>`).join('')||'<p>No products yet.</p>'}`}catch(e){$('st2').textContent='Could not load stats.'}}
function refc(){const s=$('s'),c=$('c');if(!s||!c)return;const cur=(D.posts.find(x=>x.id==edit)||D.prods.find(x=>x.id==edit)||{}).cat;c.innerHTML=opts(D.cats[s.value]||[],cur)}
async function login(){try{const r=await api('/auth/v1/token?grant_type=password',{m:'POST',b:{email:$('em').value.trim(),password:$('pw').value}});tok=r;localStorage.setItem('vls',JSON.stringify(r));await admin()}catch(e){$('msg').innerHTML='<div class="note">Problem: '+esc(e.message)+'</div>'}}
function logout(){tok=null;localStorage.removeItem('vls');admin()}
function pick(){return new Promise(res=>{const f=$('f').files[0];if(!f)return res(null);const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1000/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.8)};i.src=e.target.result};r.readAsDataURL(f)})}
async function up(){const b=await pick();if(!b)return null;const n=Date.now()+'.jpg';await api('/storage/v1/object/photos/'+n,{m:'POST',b,raw:true,h:{'Content-Type':'image/jpeg'}});return U+'/storage/v1/object/public/photos/'+n}
async function write(tbl,body){const q=edit?`?id=eq.${edit}`:'';await api('/rest/v1/'+tbl+q,{m:edit?'PATCH':'POST',b:body,h:{Prefer:'return=minimal'}});edit=null;await load();admin()}
async function savP(){if(!$('t').value.trim())return alert('Add a title');try{const im=await up(),b={title:$('t').value,sec:$('s').value,cat:$('c').value,extra:$('x').value,body:$('b').value,feat:$('ft').checked,spons:$('sp').checked};if(im)b.img=im;await write('posts',b)}catch(e){alert('Could not save: '+e.message)}}
async function savR(){const u=$('u').value.trim();if(!$('n').value.trim())return alert('Add a name');if(u&&!/^https:\/\//.test(u))return alert('Link must start with https://');try{const im=await up(),b={name:$('n').value,url:u,store:$('st').value,price:$('pr').value,sec:$('s').value,cat:$('c').value,note:$('nt').value,feat:$('ft').checked};if(im)b.img=im;await write('products',b)}catch(e){alert('Could not save: '+e.message)}}
async function del(t,id){if(!confirm('Delete this?'))return;try{await api(`/rest/v1/${t}?id=eq.${id}`,{m:'DELETE'});await load();admin()}catch(e){alert(e.message)}}
async function saveSet(k,v){try{await api('/rest/v1/settings?on_conflict=key',{m:'POST',b:{key:k,value:v},h:{Prefer:'resolution=merge-duplicates,return=minimal'}});await load();alert('Saved')}catch(e){alert('Could not save: '+e.message)}}
function savC(){const c={};S.forEach(s=>{c[s[0]]=$('k-'+s[0]).value.split(',').map(x=>x.trim()).filter(Boolean)});saveSet('cats',JSON.stringify(c))}
addEventListener('hashchange',()=>{filt='';route();if((location.hash||'#home')=='#home'&&loaded)api('/rest/v1/views',{m:'POST',b:{path:'home'},h:{Prefer:'return=minimal'}}).catch(()=>{})});
load().then(()=>{route();if(!location.hash||location.hash=='#home')api('/rest/v1/views',{m:'POST',b:{path:'home'},h:{Prefer:'return=minimal'}}).catch(()=>{})});route();
</script></body></html>
